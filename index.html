<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cont.css">
    
    <title>Folha de contatos</title>
</head>
<body>
    <form action="#" method="get">
        <fieldset>
            <h1>Formulário de contatos</h1>

            <label for="name">Seu nome
            <input type="text" name="nome" id="name" required placeholder="Luciano Ronaldo" autofocus>
            </label>

            <label for="email">Seu email
            <input type="email" name="email" id="email" required placeholder="nome@email.com">
            </label>

            <label for="ass">Assunto
            <input type="text" name="ass" id="ass" required placeholder="Pedido de desistência">
            </label>

            <label for="msg">Mensagem
            <textarea name="mensagem" id="msg" rows="10" cols="40"></textarea>
            </label>

            <button type="submit">Enviar</button>
        </fieldset>
    </form>
</body>
</html>
